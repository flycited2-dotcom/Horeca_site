<!DOCTYPE html>

    @font-face { font-family: 'Manrope'; font-weight: 200 800; src: url('../../node_modules/@fontsource-variable/manrope/files/manrope-cyrillic-wght-normal.woff2') format('woff2'); unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116; }

</style>
</head>
<body>
<div class="frame">
    <div class="brand"><img src="icon.svg" alt=""><span>Гастроснаб</span></div>

    <div class="foot">
        <div class="lead">Цены, наличие на складах, заявка без регистрации. Симферополь, Крым</div>
