<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex">
    <title>Обновляем сайт — Гастроснаб</title>
    <style>
        :root { color-scheme: light; }
        body {
            margin: 0;
            min-height: 100dvh;
            display: grid;
            place-items: center;
            padding: 24px;
            background: #F4F6F7;
            color: #15191D;
            font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        }
        main {
            max-width: 480px;
            padding: 32px 24px;
            border: 1px solid #D3D9DE;
            border-radius: 4px;
            background: #FFFFFF;
        }
        h1 { margin: 0 0 12px; font-size: 24px; line-height: 1.25; }
        p { margin: 0 0 8px; color: #5D686F; }
        p:last-child { margin-bottom: 0; }
    </style>
</head>
<body>
    <main>
        <h1>Обновляем сайт</h1>
        <p>Это займёт около минуты. Обновите страницу чуть позже — каталог и корзина останутся на месте.</p>
        <p>Если нужно срочно, позвоните нам: менеджер подберёт оборудование и назовёт цену.</p>
    </main>
</body>
</html>
