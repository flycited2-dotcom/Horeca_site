; Пул PHP-FPM магазина. Процессов немного: сервер общий с другими сайтами (ТЗ §17.1).
; Переменные окружения контейнера доходят до PHP — настройки приходят из .env сервера.

[www]
clear_env = no
pm = dynamic
pm.max_children = 6
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3
pm.max_requests = 500
