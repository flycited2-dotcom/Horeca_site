# nginx сервера для боевого сайта (ТЗ §17.2): /etc/nginx/sites-available/gastrosnab.ru.
# Кладётся и включается ДО переключения DNS; HTTPS добавляет certbot после него:
#   certbot --nginx -d gastrosnab.ru -d www.gastrosnab.ru \
#     -d xn--80aadf5cfnhch.xn--p1ai -d www.xn--80aadf5cfnhch.xn--p1ai
# Запросы уходят в контейнер web (127.0.0.1:8090), как у тестового сайта.
# Адрес покупателя передаётся заменой, а не дописыванием: подделать его снаружи нельзя.

# Главный адрес.
server {
    listen 80;
    listen [::]:80;
    server_name gastrosnab.ru;

    client_max_body_size 14m;

    # Если контейнеры магазина перезапускаются, показываем «Обновляем сайт» вместо ошибки.
    # Страницу кладёт сюда выкладка (docker/deploy.sh). Ответы самого магазина не подменяются.
    error_page 502 504 =503 /maintenance.html;

    location = /maintenance.html {
        root /var/www/gastrosnab;
        add_header Retry-After 60 always;
        add_header Cache-Control "no-store" always;
        internal;
    }

    location / {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_read_timeout 120s;
    }
}

# «www» и «гастроснаб.рф» ведут на главный адрес одним переходом, с сохранением пути и
# запроса (ТЗ §17.2). Без HTTPS certbot не выпустит для них сертификат, поэтому блок
# остаётся отдельным: certbot добавит в него свой порт 443 сам.
server {
    listen 80;
    listen [::]:80;
    server_name www.gastrosnab.ru xn--80aadf5cfnhch.xn--p1ai www.xn--80aadf5cfnhch.xn--p1ai;

    return 301 https://gastrosnab.ru$request_uri;
}
