# nginx сервера для тестового сайта (ТЗ §17): /etc/nginx/sites-available/test.gastrosnab.ru.
# HTTPS добавляет certbot (certbot --nginx -d test.gastrosnab.ru), запросы уходят в контейнер web.
# Адрес покупателя передаётся заменой, а не дописыванием: подделать его снаружи нельзя.

server {
    listen 80;
    listen [::]:80;
    server_name test.gastrosnab.ru;

    client_max_body_size 14m;

    # Тестовый сайт не должен попасть в поиск.
    add_header X-Robots-Tag "noindex, nofollow" always;

    # Если контейнеры магазина перезапускаются, показываем «Обновляем сайт» вместо ошибки.
    # Страницу кладёт сюда выкладка (docker/deploy.sh). Ответы самого магазина не подменяются:
    # proxy_intercept_errors выключен, поэтому его собственная страница обслуживания доходит как есть.
    error_page 502 504 =503 /maintenance.html;

    location = /maintenance.html {
        root /var/www/gastrosnab;
        add_header Retry-After 60 always;
        add_header Cache-Control "no-store" always;
        internal;
    }

    location / {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_read_timeout 120s;
    }
}
